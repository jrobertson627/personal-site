<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jessica Robertson — Software Engineer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Basic meta. This is the fallback any non-JS-executing crawler or
         link-unfurl bot sees; JS-executing visitors get per-route titles
         and descriptions instead, applied via useDocumentMeta (see
         Home.tsx, BlogPost.tsx, etc.). -->
    <meta
      name="description"
      content="Jessica Robertson is a software engineer building secure, scalable full-stack applications. Portfolio, projects, and writing."
    />
    <!-- No canonical link yet — it needs an absolute URL and there's no
         production domain until deployment (#27-29). Add
         <link rel="canonical" href="https://..."/> once one exists. -->

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jessica Robertson" />
    <meta property="og:title" content="Jessica Robertson — Software Engineer" />
    <meta
      property="og:description"
      content="Jessica Robertson is a software engineer building secure, scalable full-stack applications. Portfolio, projects, and writing."
    />
    <!-- Root-relative for now: og:image/twitter:image technically want an
         absolute URL per spec, but there's no production domain yet
         (deployment is #27-29). Update to the full https://... URL once
         one exists. -->
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jessica Robertson — Software Engineer" />
    <meta
      name="twitter:description"
      content="Jessica Robertson is a software engineer building secure, scalable full-stack applications. Portfolio, projects, and writing."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Prevent dark mode flash -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Fraunces (headings) + Inter (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- React entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
